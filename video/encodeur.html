<!doctype html>
<meta charset="utf-8">
<title>Encodeur P’NUTS</title>
<script src="mp4-muxer.js"></script>
<script>
/* Encode les images capturées (frames/iNNNNN.png) en MP4 H.264 + AAC par WebCodecs, avec une bande-son synthétisée. */

/* Bande sonore : pulsation grave régulière (l'énergie du lieu), nappe qui s'ouvre sur la Paint Room,
   quatre coups secs sur les photos du Release Room, respiration finale sur la signature. */
async function bandeSon(duree) {
  const sr = 48000;
  const ac = new OfflineAudioContext(2, Math.ceil(duree * sr), sr);
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2; comp.connect(master);
  const nappe = (t0, t1, notes, gain, fc) => {
    const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + 1.0); g.gain.setValueAtTime(gain, t1 - 0.9); g.gain.linearRampToValueAtTime(0, t1);
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(fc, t0); f.frequency.linearRampToValueAtTime(fc * 1.6, t1);
    g.connect(f); f.connect(comp);
    notes.forEach((fr, i) => { for (const [type, det, k] of [['sawtooth', 0, 0.45], ['triangle', 6, 0.4], ['sine', -5, 0.6]]) { const o = ac.createOscillator(); o.type = type; o.frequency.value = fr; o.detune.value = det + (i % 2 ? 3 : -3); const og = ac.createGain(); og.gain.value = k / notes.length; o.connect(og); og.connect(g); o.start(t0); o.stop(t1 + 0.1); } });
  };
  const note = (t, fr, gain = 0.1, dur = 1.0, type = 'sine') => {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = fr;
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = fr * 2; const g2 = ac.createGain(); g2.gain.value = 0.2;
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(comp); o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  };
  const kick = (t, gain = 0.45) => { const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.13); const g = ac.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3); o.connect(g); g.connect(comp); o.start(t); o.stop(t + 0.32); };
  /* le « crunch » : bruit bref filtré haut, comme une cacahuète qui craque */
  const crunch = (t, gain = 0.5, dur = 0.09) => { const n = ac.createBuffer(1, Math.ceil(dur * sr), sr); const d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.6); const s = ac.createBufferSource(); s.buffer = n; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 0.9; const g = ac.createGain(); g.gain.value = gain; s.connect(f); f.connect(g); g.connect(comp); s.start(t); s.stop(t + dur); };
  const souffle = (t0, t1, gain = 0.05) => { const n = ac.createBuffer(1, Math.ceil((t1 - t0) * sr), sr); const d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = ac.createBufferSource(); s.buffer = n; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(500, t0); f.frequency.exponentialRampToValueAtTime(3200, t1); f.Q.value = 0.8; const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t1 - 0.08); g.gain.linearRampToValueAtTime(0, t1); s.connect(f); f.connect(g); g.connect(comp); s.start(t0); s.stop(t1); };
  /* pulsation joueuse à 120 bpm avec un crunch sur les contretemps, jusqu'à la signature */
  const pas = 0.5; for (let t = 2.1; t < 33.6; t += pas) { kick(t, 0.42); crunch(t + 0.25, 0.22, 0.06); }
  /* P1 : la cacahuète tombe et rebondit, le mot-symbole claque */
  [0.55, 0.78, 0.93, 1.03].forEach((t, i) => crunch(t, 0.55 - i * 0.1, 0.1));
  note(2.1, 130.81, 0.22, 2.2, 'triangle'); note(2.12, 261.63, 0.12, 2.0); note(2.25, 1046.5, 0.06, 0.6);
  /* P2 : le hero, accord majeur chaleureux (Do majeur) */
  nappe(5.0, 11.0, [130.81, 196, 261.63, 329.63, 392], 0.15, 700);
  [5.6, 5.8, 5.9].forEach((t, i) => { crunch(t, 0.45, 0.08); note(t, [523.25, 659.25, 783.99][i], 0.06, 0.9); });
  note(6.4, 1046.5, 0.05, 0.8);
  /* P3 Honey : Sol majeur, doux ; P4 Lemon : La majeur, vif ; P5 Paprika : Ré mineur, profond */
  nappe(11.0, 16.0, [98, 146.83, 196, 246.94, 293.66], 0.15, 800);
  nappe(16.0, 21.0, [110, 164.81, 220, 277.18, 329.63], 0.16, 1000);
  nappe(21.0, 26.0, [73.42, 110, 146.83, 174.61, 220], 0.17, 480);
  [10.6, 15.6, 20.6, 25.6, 31.1].forEach((t) => souffle(t, t + 0.55, 0.06));
  [11.15, 16.15, 21.15].forEach((t, i) => { crunch(t, 0.6, 0.11); note(t + 0.02, [392, 440, 293.66][i], 0.12, 1.4, 'triangle'); });
  [12.5, 17.5, 22.5].forEach((t, i) => note(t, [783.99, 880, 587.33][i], 0.05, 0.8));
  /* P6 : bandeau et piliers, Fa majeur, trois tics */
  nappe(26.0, 31.5, [87.31, 130.81, 174.61, 220, 261.63], 0.16, 900);
  [26.6, 27.1, 27.6].forEach((t, i) => { crunch(t, 0.5, 0.09); note(t, [523.25, 659.25, 783.99][i], 0.07, 0.9); });
  /* P7 : signature en Do, puis le partenaire, respiration */
  nappe(31.5, 36.0, [65.41, 130.81, 196, 261.63, 329.63], 0.16, 600);
  note(31.7, 130.81, 0.2, 2.6, 'triangle'); note(31.9, 523.25, 0.07, 1.8); note(32.2, 1046.5, 0.05, 1.0);
  note(34.0, 392, 0.06, 1.8); note(34.4, 523.25, 0.06, 1.6);
  return await ac.startRendering();
}

window.encoder = async ({ dossier, total, ips, largeur, hauteur, debit }) => {
  const vcfg = { codec: 'avc1.640028', width: largeur, height: hauteur, bitrate: debit, framerate: ips, bitrateMode: 'variable', latencyMode: 'quality', avc: { format: 'avc' } };
  const acfg = { codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 160000 };
  const vs = await VideoEncoder.isConfigSupported(vcfg);
  const as = await AudioEncoder.isConfigSupported(acfg);
  if (!vs.supported) throw new Error('H.264 non pris en charge');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: largeur, height: hauteur, frameRate: ips }, audio: as.supported ? { codec: 'aac', numberOfChannels: 2, sampleRate: 48000 } : undefined, fastStart: 'in-memory', firstTimestampBehavior: 'offset' });
  window.audio = as.supported;
  if (as.supported) {
    const son = await bandeSon(total / ips);
    const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: (e) => { window.erreur = 'audio ' + e.message; } });
    aenc.configure(acfg);
    const L = son.getChannelData(0), R = son.getChannelData(1), N = 1024;
    for (let i = 0; i < L.length; i += N) { const n = Math.min(N, L.length - i); const d = new Float32Array(n * 2); d.set(L.subarray(i, i + n), 0); d.set(R.subarray(i, i + n), n); const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((i * 1e6) / 48000), data: d }); aenc.encode(ad); ad.close(); }
    await aenc.flush();
  }
  const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => { window.erreur = 'vidéo ' + e.message; } });
  venc.configure(vcfg);
  const canvas = new OffscreenCanvas(largeur, hauteur);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  window.erreur = '';
  for (let i = 0; i < total; i++) {
    const img = new Image();
    img.src = dossier + '/i' + String(i).padStart(5, '0') + '.png';
    await img.decode();
    ctx.drawImage(img, 0, 0, largeur, hauteur);
    const vf = new VideoFrame(canvas, { timestamp: Math.round((i * 1e6) / ips), duration: Math.round(1e6 / ips) });
    venc.encode(vf, { keyFrame: i % (ips * 2) === 0 });
    vf.close();
    while (venc.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 4));
    window.avancement = i + 1;
  }
  await venc.flush();
  muxer.finalize();
  const octets = new Uint8Array(muxer.target.buffer);
  window.resultat = octets;
  return octets.length;
};
window.tranche = (debut, fin) => { const o = window.resultat.subarray(debut, fin); let s = ''; for (let i = 0; i < o.length; i += 32768) s += String.fromCharCode.apply(null, o.subarray(i, i + 32768)); return btoa(s); };
window.pret = true;
</script>
